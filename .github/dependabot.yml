version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - react
          - react-dom
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
    labels:
      - dependencies
      - security
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      codeql:
        patterns:
          - github/codeql-action/*
    labels:
      - dependencies
