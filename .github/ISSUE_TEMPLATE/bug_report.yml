name: Bug report
description: Report a reproducible problem using synthetic data.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real backups, tokens, private notes, or sensor endpoints. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: App version and commit
      placeholder: 0.1.0 / abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, and deployment URL
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
